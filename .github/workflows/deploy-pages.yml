name: Deploy Metrics Dashboard to GitHub Pages

# Runs automatically whenever the CI or ML workflow finishes on main,
# and can also be triggered manually via the "Run workflow" button.
on:
  workflow_run:
    workflows:
      - "CI with Metrics"
      - "ML Example — Train and Evaluate"
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Only one Pages deployment at a time; later runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & Deploy Dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------------
      # Download the most recent successful artifacts from each workflow.
      # Both downloads are best-effort (continue-on-error) so the deploy
      # still works when only one set of metrics is available.
      # ------------------------------------------------------------------

      - name: Download latest CI metrics artifact
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow ci-metrics.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId' 2>/dev/null || echo "")
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            echo "Downloading CI metrics from run $RUN_ID"
            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name ci-metrics \
              --dir .artifacts/ 2>/dev/null || true
          else
            echo "No successful CI metrics run found; skipping."
          fi

      - name: Download latest ML metrics artifact
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow ml-example.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId' 2>/dev/null || echo "")
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            echo "Downloading ML metrics from run $RUN_ID"
            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name trained-model \
              --dir artifacts/ 2>/dev/null || true
          else
            echo "No successful ML example run found; skipping."
          fi

      - name: List downloaded files
        run: |
          echo "=== .artifacts/ ===" && ls -la .artifacts/ 2>/dev/null || echo "(empty)"
          echo "=== artifacts/ ===" && ls -la artifacts/ 2>/dev/null || echo "(empty)"

      - name: Generate combined metrics dashboard
        run: |
          mkdir -p _site
          python scripts/metrics_dashboard.py \
            --ml-metrics artifacts/metrics.json \
            --ci-metrics .artifacts/ci_metrics.json \
            --output _site/index.html

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics-dashboard
          path: _site/index.html
          if-no-files-found: error

      # `actions/configure-pages` can only auto-enable Pages when it is given
      # a PAT or GitHub App token, so this workflow checks first and skips the
      # deploy cleanly when the repository has not enabled Pages yet.
      - name: Check GitHub Pages availability
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_error_file=$(mktemp)
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>"$pages_error_file"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            api_error=$(tr '\n' ' ' < "$pages_error_file" | sed 's/[[:space:]]\+/ /g')
            if printf '%s' "$api_error" | grep -q "404"; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Pages deployment skipped::GitHub Pages is not enabled for this repository. Enable it in repository settings to publish the dashboard."
              echo "::warning title=Pages API response::$api_error"
              {
                echo "## GitHub Pages deployment skipped"
                echo
                echo "GitHub Pages is not enabled for this repository."
                echo "Enable Pages in repository settings to publish the dashboard artifact automatically."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Pages API check failed::$api_error"
              exit 1
            fi
          fi

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
